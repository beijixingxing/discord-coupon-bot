# ====================================================================
# =================== 自动回复配置文件 (示例) ===================
# ====================================================================
#
# 说明:
# 1. 将此文件复制为 'auto_responses.yml' 并根据需要修改。
# 2. 每个顶级键是频道ID，值是该频道的回复规则列表。
# 3. 如果消息包含任何关键词，机器人会自动回复指定内容。
# (受 config.yml 中的全局 allowed_channel_ids 限制)

# 这里的规则只在ID为 EXAMPLE_CHANNEL_ID 的频道或子区生效
'EXAMPLE_CHANNEL_ID':
  rules:
    - keywords:
        - '示例关键词'
        - '公益站'
        - '帮助'
      response: |
        ## 欢迎使用我们的机器人！

        **相关链接**:
        <https://discord.com/channels/SERVER_ID/CHANNEL_ID>

        如有问题，请私信管理员。谢谢！
      # 排除触发者ID列表，这些用户发送的消息不会触发自动回复
      exclude_users:
        - 123456789012345678 # 示例用户ID - 替换为实际的管理员ID

# 另一个频道的配置示例
'ANOTHER_CHANNEL_ID':
  rules:
    - keywords:
        - '使用说明'
        - '帮助'
        - '指南'
      response: |
        **机器人使用指南**

        `/help` - 查看帮助信息
        `/status` - 查看机器人状态
        `/库存` - 查看当前库存

        更多信息请查看置顶消息。

    - keywords:
        - '感谢'
        - '谢谢'
      response: |
        不用谢！我们很高兴能为您提供帮助 😊

        如果您有任何问题，随时可以联系我们的管理员团队。

# 全局关键词匹配 (在所有允许的频道中生效)
'global':
  rules:
    - keywords:
        - '机器人状态'
        - '在线吗'
      response: '✅ 机器人正常运行中！如需帮助请使用 `/help` 命令。'

    - keywords:
        - '联系管理员'
        - '客服'
      response: |
        📞 **联系我们**

        如需人工协助，请：
        1. 私信服务器管理员
        2. 在相关频道 @ 管理员
        3. 通过官方联系方式

        我们会尽快回复您！
